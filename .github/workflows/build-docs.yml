name: Build Docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to latest
        run: |
          git submodule update --remote _docsrc/ccjieba

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: |
          mdbook build _docsrc/ccjieba/docs
          cd _docsrc/ccjieba/docs && doxygen Doxyfile
          rm -rf projects/ccjieba
          cp -r _docsrc/ccjieba/docs/book projects/ccjieba
          cp -r _docsrc/ccjieba/docs/doxygen/html projects/ccjieba/doxygen

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update ccjieba documentation'
          file_pattern: 'projects/ccjieba/** _docsrc/ccjieba'
