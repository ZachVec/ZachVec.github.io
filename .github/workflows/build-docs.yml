name: Build Docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodule
        run: git submodule update --remote _docsrc/ccjieba

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen graphviz

      - name: Build project docs
        run: |
          mdbook build _docsrc/ccjieba/docs
          (cd _docsrc/ccjieba/docs && doxygen Doxyfile)

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1

      - name: Merge docs into site
        run: |
          sudo mkdir -p _site/projects/ccjieba
          sudo cp -r _docsrc/ccjieba/docs/book/* _site/projects/ccjieba/
          sudo cp -r _docsrc/ccjieba/docs/doxygen/html _site/projects/ccjieba/doxygen

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
